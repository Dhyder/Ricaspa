<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d4e3e"><link rel="icon" type="image/png" href="/assets/img/favicon.png"><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png"><link rel="stylesheet" href="/dashboard/rica-dashboard.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><title>Rica Spa | Staff Login</title><style>body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#edf2ec 0,var(--rica-cream) 48%,#eee7da 100%)}.login{width:min(430px,calc(100% - 32px));background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 25px 70px rgba(18,53,43,.13)}.login-brand{text-align:center;margin-bottom:28px}.login-brand img{width:82px;height:82px;object-fit:contain;border-radius:50%;background:#fff;padding:7px;box-shadow:0 8px 25px rgba(18,53,43,.1)}.login-brand h1{font-size:27px;margin:14px 0 4px}.login-brand p{color:var(--muted);margin:0;font-size:12px}.login-note{padding:11px 13px;background:#f6f3ec;border:1px solid #e9e2d5;border-radius:10px;color:#6e766f;font-size:11px;line-height:1.5;margin-bottom:20px}.error{margin:12px 0;padding:11px;border-radius:9px;background:#f9e9e6;color:#7e3026;font-size:12px}</style></head><body><main class="login"><div class="login-brand"><img src="/assets/img/logo.png" alt="Rica Spa"><h1>Rica Spa</h1><p>Staff & administration</p></div><div class="login-note">Sign in with your individual Rica account. Your approvals, redemptions and administrative actions are recorded under your account.</div><form id="login"><label>Email address<input name="email" type="email" autocomplete="username" placeholder="you@ricaspa.co.ke" required></label><label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Your password" required></label><div id="error"></div><button type="submit" style="width:100%;margin-top:8px">Sign in to Rica Spa</button></form></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),error=document.querySelector('#error'),button=e.target.querySelector('button');error.innerHTML='';button.disabled=true;button.textContent='Signing in…';try{const r=await fetch('/api/dashboard-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to sign in');location.href='/dashboard/'}catch(x){error.innerHTML='<div class="error">'+x.message.replace(/[&<>]/g,'')+'</div>';button.disabled=false;button.textContent='Sign in to Rica Spa'}};</script></body></html>
