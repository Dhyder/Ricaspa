<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rica Spa — Voucher Desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  body{font-family:system-ui,sans-serif;background:#16241C;color:#F8F3E6;max-width:480px;margin:0 auto;padding:32px 20px;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:rgba(248,243,230,0.6);font-size:13px;margin-top:0;margin-bottom:24px;}
  input{width:100%;padding:12px;border-radius:8px;border:1px solid rgba(248,243,230,0.25);background:rgba(248,243,230,0.06);color:#F8F3E6;font-size:16px;box-sizing:border-box;margin-bottom:10px;}
  button{width:100%;padding:12px;border-radius:8px;border:none;font-weight:600;font-size:15px;cursor:pointer;margin-bottom:10px;}
  .btn-lookup{background:rgba(248,243,230,0.12);color:#F8F3E6;}
  .btn-redeem{background:#B9924A;color:#16241C;}
  .btn-redeem:disabled{opacity:0.4;cursor:not-allowed;}
  #result{margin-top:20px;padding:16px;border-radius:8px;background:rgba(248,243,230,0.06);font-size:14px;line-height:1.6;display:none;}
  #result.error{background:rgba(224,122,122,0.15);color:#e07a7a;}
  #result.ok{background:rgba(111,191,115,0.15);}
  .row{display:flex;justify-content:space-between;margin-bottom:4px;}
  .row b{color:#B9924A;}
  #gate{max-width:320px;margin:80px auto;text-align:center;}
  .btn-scan{background:rgba(185,146,74,0.18);color:#B9924A;border:1px solid rgba(185,146,74,0.4);}
  #scanBox{display:none;margin-bottom:10px;border-radius:8px;overflow:hidden;position:relative;background:#000;}
  #scanVideo{width:100%;display:block;}
  #scanHint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#F8F3E6;font-size:11px;background:rgba(0,0,0,0.5);padding:4px 0;}
  .btn-cancel-scan{background:rgba(224,122,122,0.15);color:#e07a7a;}
</style>
</head>
<body>

<div id="gate">
  <h1>Staff access</h1>
  <p class="sub">Enter the voucher desk passphrase.</p>
  <input id="secretInput" type="password" placeholder="Passphrase" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn-lookup" onclick="unlock()">Unlock</button>
  <div id="gateError" style="display:none;color:#e07a7a;font-size:13px;margin-top:6px;"></div>
</div>

<div id="desk" style="display:none;">
  <h1>Voucher Desk</h1>
  <p class="sub">Look up or redeem a customer's voucher code. · <a href="/staff-bookings.html" style="color:#B9924A;">Booking tracker →</a></p>

  <input id="codeInput" type="text" placeholder="RICA-XXXX-XXXX" autocapitalize="characters" oninput="scannedSignature=null">
  <button class="btn-lookup" onclick="lookup()">Look up</button>
  <button class="btn-redeem" id="redeemBtn" onclick="redeem()" disabled>Mark as redeemed</button>

  <div id="scanBox">
    <video id="scanVideo" playsinline muted></video>
    <div id="scanHint">Point the camera at the voucher's QR code</div>
  </div>
  <button class="btn-scan" id="scanBtn" onclick="toggleScan()">📷 Scan QR code</button>

  <div id="result"></div>
</div>

<canvas id="scanCanvas" style="display:none;"></canvas>
<script src="/assets/vendor/jsqr/jsQR.js"></script>
<script>
  let staffSecret = '';
  let scannedSignature = null;
  let scanStream = null;
  let scanRAF = null;

  async function toggleScan() {
    const box = document.getElementById('scanBox');
    const btn = document.getElementById('scanBtn');
    if (scanStream) {
      stopScan();
      return;
    }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch {
      showResult({ error: 'Camera access denied or unavailable. Type the code instead.' }, true);
      return;
    }
    const video = document.getElementById('scanVideo');
    video.srcObject = scanStream;
    await video.play();
    box.style.display = 'block';
    btn.textContent = '✕ Cancel scan';
    btn.className = 'btn-cancel-scan';
    scanTick();
  }

  function stopScan() {
    if (scanRAF) cancelAnimationFrame(scanRAF);
    scanRAF = null;
    if (scanStream) {
      scanStream.getTracks().forEach((t) => t.stop());
      scanStream = null;
    }
    document.getElementById('scanBox').style.display = 'none';
    const btn = document.getElementById('scanBtn');
    btn.textContent = '📷 Scan QR code';
    btn.className = 'btn-scan';
  }

  function scanTick() {
    const video = document.getElementById('scanVideo');
    const canvas = document.getElementById('scanCanvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const result = window.jsQR(imageData.data, imageData.width, imageData.height);
      if (result && result.data) {
        const raw = result.data.trim();
        const [scannedCode, scannedSig] = raw.includes('.') ? raw.split('.') : [raw, null];
        stopScan();
        document.getElementById('codeInput').value = scannedCode.toUpperCase();
        scannedSignature = scannedSig;
        lookup();
        return;
      }
    }
    scanRAF = requestAnimationFrame(scanTick);
  }

  function unlock() {
    const input = document.getElementById('secretInput').value;
    if (!input) return;
    verifyAndEnter(input);
  }

  async function verifyAndEnter(secret) {
    const gateError = document.getElementById('gateError');
    gateError.style.display = 'none';
    try {
      const res = await fetch('/api/staff-auth', { headers: { 'X-Staff-Secret': secret } });
      if (!res.ok) {
        sessionStorage.removeItem('ricaspa_staff_secret');
        gateError.textContent = 'Wrong passphrase.';
        gateError.style.display = 'block';
        return;
      }
      staffSecret = secret;
      sessionStorage.setItem('ricaspa_staff_secret', secret);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('desk').style.display = '';
    } catch {
      gateError.textContent = 'Network error, please try again.';
      gateError.style.display = 'block';
    }
  }

  // Same-tab session persistence — a shared front-desk device shouldn't
  // need the passphrase retyped every page refresh during a shift.
  // sessionStorage clears when the tab closes, unlike localStorage.
  (function tryAutoUnlock() {
    const saved = sessionStorage.getItem('ricaspa_staff_secret');
    if (saved) verifyAndEnter(saved);
  })();

  function showResult(data, isError) {
    const el = document.getElementById('result');
    el.style.display = 'block';
    el.className = isError ? 'error' : 'ok';

    if (isError) {
      el.innerHTML = `<div>${escapeHtml(data.error || 'Something went wrong.')}</div>`;
      document.getElementById('redeemBtn').disabled = true;
      return;
    }

    const v = data.voucher;
    const valueText = v.type === 'amount' ? `KES ${Number(v.value).toLocaleString()}` : (v.serviceName || v.value);
    el.innerHTML = `
      ${scannedSignature ? `<div class="row"><span>QR signature</span><b style="color:#6fbf73;">✓ verified</b></div>` : ''}
      <div class="row"><span>Status</span><b>${escapeHtml(v.status.toUpperCase())}</b></div>
      <div class="row"><span>Value</span><b>${escapeHtml(String(valueText))}</b></div>
      <div class="row"><span>To</span><span>${escapeHtml(v.toName)}</span></div>
      <div class="row"><span>Expires</span><span>${escapeHtml(new Date(v.expiresAt).toLocaleDateString())}</span></div>
      ${v.redeemedAt ? `<div class="row"><span>Redeemed</span><span>${escapeHtml(new Date(v.redeemedAt).toLocaleString())}</span></div>` : ''}
    `;
    document.getElementById('redeemBtn').disabled = v.status === 'redeemed';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function callApi(action) {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) return;
    try {
      const res = await fetch('/api/redeem-voucher', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Staff-Secret': staffSecret },
        body: JSON.stringify({ code, action, signature: scannedSignature || undefined }),
      });
      if (res.status === 401) {
        sessionStorage.removeItem('ricaspa_staff_secret');
        document.getElementById('desk').style.display = 'none';
        document.getElementById('gate').style.display = '';
        document.getElementById('gateError').textContent = 'Session expired or passphrase changed — please re-enter it.';
        document.getElementById('gateError').style.display = 'block';
        return;
      }
      const data = await res.json();
      showResult(data, !res.ok);
    } catch {
      showResult({ error: 'Network error, please try again.' }, true);
    }
  }

  function lookup() { callApi('lookup'); }
  function redeem() { callApi('redeem'); }
</script>

</body>
</html>
