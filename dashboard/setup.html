<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d4e3e"><link rel="icon" href="/assets/img/favicon.png"><link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png"><link rel="stylesheet" href="/dashboard/rica-dashboard.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet"><title>Rica Spa | First Superuser</title><style>body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#edf2ec 0,var(--c) 48%,#eee7da 100%)}.setup{width:min(500px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 25px 70px rgba(18,53,43,.13)}.brand{text-align:center;margin:0 0 26px}.brand img{width:82px;height:82px;object-fit:contain;border-radius:50%;padding:7px}.brand h1{font-size:27px;margin:14px 0 5px}.brand p{color:var(--muted);font-size:13px;margin:0}.intro{padding:13px 15px;background:#f6f3ec;border:1px solid #e9e2d5;border-radius:11px;font-size:12px;line-height:1.55;color:#66706a;margin-bottom:22px}.error,.success{margin:12px 0;padding:11px;border-radius:9px;font-size:12px}.error{background:#f9e9e6;color:#7e3026}.success{background:#eaf2ed;color:var(--g)}</style></head><body><main class="setup"><div class="brand"><img src="/assets/img/logo.png" alt="Rica Spa"><h1>Create your Superuser</h1><p>Rica Spa staff administration</p></div><div class="intro">This one-time setup creates the first Superuser for this Rica dashboard. The setup key must be configured on the production deployment. Once an account exists, this page can no longer create another initial account.</div><form id="setup"><label>Setup key<input name="setupKey" type="password" autocomplete="off" required></label><label>Your name<input name="name" autocomplete="name" placeholder="Full name" required></label><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@ricaspa.co.ke" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label><div id="message"></div><button type="submit" style="width:100%;margin-top:8px">Create Superuser</button></form><p style="text-align:center;margin:18px 0 0;font-size:12px"><a href="/dashboard/login.html" style="color:var(--g);font-weight:700">Back to sign in</a></p></main><script>const f=document.querySelector('#setup'),m=document.querySelector('#message'),b=f.querySelector('button');f.onsubmit=async e=>{e.preventDefault();m.innerHTML='';b.disabled=true;b.textContent='Creating…';try{const r=await fetch('/api/dashboard-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to create Superuser');m.innerHTML='<div class="success">Superuser created. You can now sign in.</div>';f.reset();setTimeout(()=>location.href='/dashboard/login.html',900)}catch(x){m.innerHTML='<div class="error">'+String(x.message).replace(/[&<>]/g,'')+'</div>';b.disabled=false;b.textContent='Create Superuser'}};</script></body></html>
