<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rica Spa | Staff Login</title><link rel="icon" href="/dashboard/images/favicon.svg"><style>:root{font-family:Inter,system-ui,sans-serif;color:#173d31;background:#f8f5ef}body{min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e6dfd1;border-radius:20px;padding:32px;box-shadow:0 18px 60px #173d3118}.logo{width:180px;height:auto;margin-bottom:18px}h1{margin:0 0 6px;font-family:Georgia,serif}.muted{color:#66736d;margin:0 0 24px}label{display:grid;gap:6px;margin:14px 0;font-size:14px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d8d2c7;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#1d4e3e;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.alt{text-align:center;font-size:13px;margin-top:18px}.alt a{color:#1d4e3e;font-weight:700}.status{margin-top:14px;font-size:14px}</style></head>
<body><main class="card"><img class="logo" src="/dashboard/images/rica-logo.svg" alt="Rica Spa"><h1>Welcome back</h1><p class="muted">Sign in to the Rica Spa staff dashboard.</p><form id="form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><div class="status" id="status"></div></form><p class="alt">Legacy staff access? Use your staff passphrase below.</p><form id="legacy"><label>Staff passphrase<input name="passphrase" type="password" autocomplete="current-password" required></label><button>Sign in with passphrase</button></form><p class="alt"><a href="/dashboard/signup">Create staff account</a></p></main><script>
const form=document.querySelector('#form'),legacy=document.querySelector('#legacy'),status=document.querySelector('#status');
async function login(body){status.textContent='Signing in…';try{const r=await fetch('/api/dashboard-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)}),j=await r.json();if(!r.ok){status.textContent=j.error||'Login failed';return}const returnTo=new URLSearchParams(location.search).get('returnTo');location.replace(returnTo && returnTo.startsWith('/dashboard/') ? returnTo : '/dashboard/')}catch{status.textContent='Could not reach the server.'}}
form.onsubmit=e=>{e.preventDefault();login(Object.fromEntries(new FormData(form)))};
legacy.onsubmit=e=>{e.preventDefault();login(Object.fromEntries(new FormData(legacy)))};
</script></body></html>
