<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d31"><link rel="manifest" href="/manifest.webmanifest"><title>Rica Spa | Sign in</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173d31;background:#f6f3ec}*{box-sizing:border-box}body{margin:0;min-height:100vh}.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.brand{background:linear-gradient(145deg,#173d31,#285744);color:#fff;padding:clamp(32px,7vw,88px);display:flex;align-items:center}.brand-inner{max-width:520px}.mark{display:inline-flex;width:54px;height:54px;border:1px solid #d5b46b;border-radius:16px;align-items:center;justify-content:center;color:#d5b46b;font:700 25px Georgia,serif}.brand-name{margin:22px 0 0;font:400 clamp(38px,5vw,68px)/.98 Georgia,serif}.brand p{max-width:430px;color:#e4eee8;font-size:16px;line-height:1.7}.panel{display:flex;align-items:center;justify-content:center;padding:32px}.card{width:min(420px,100%)}.eyebrow{color:#a47c38;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.card h1{font:400 42px/1.1 Georgia,serif;margin:8px 0}.muted{color:#6d756f;margin:0 0 26px}label{display:grid;gap:7px;margin:16px 0;font-size:13px;font-weight:700}input,select{width:100%;padding:13px 14px;border:1px solid #ded8cc;border-radius:10px;background:#fff;font:inherit}input:focus,select:focus{outline:3px solid #173d3120;border-color:#173d31}button{width:100%;padding:14px;border:0;border-radius:10px;background:#173d31;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.error{color:#a23d3d;font-size:13px;margin-top:12px}.footer{text-align:center;color:#6d756f;font-size:13px;margin-top:22px}.footer a{color:#173d31;font-weight:800;text-decoration:none}.legacy{margin-top:28px;padding-top:22px;border-top:1px solid #e5dfd4}.legacy summary{cursor:pointer;font-size:13px;font-weight:700}.hidden{display:none!important}@media(max-width:800px){.auth{grid-template-columns:1fr}.brand{display:none}.panel{min-height:100vh}} </style></head><body><main class="auth"><section class="brand"><div class="brand-inner"><span class="mark">R</span><h2 class="brand-name">Rica Spa</h2><p>Staff workspace for bookings, vouchers, clients and daily operations. Sign in to continue to the private dashboard.</p></div></section><section class="panel"><div class="card"><div class="eyebrow">Staff portal</div><h1>Welcome back</h1><p class="muted">Sign in to your Rica Spa account.</p><form id="accountForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><button type="submit">Sign in</button><p id="error" class="error"></p></form><div class="legacy"><details><summary>Use staff passphrase</summary><form id="legacyForm"><label>Staff passphrase<input name="passphrase" type="password" autocomplete="current-password" required></label><button type="submit">Sign in with passphrase</button></form></details></div><p class="footer">Need an account? <a href="/dashboard/signup.html">Create staff account</a></p></div></section></main><script>const error=document.getElementById('error');const returnTo=new URLSearchParams(location.search).get('returnTo');const destination=returnTo&&returnTo.startsWith('/dashboard/')?returnTo:'/dashboard/';async function signIn(body){error.textContent='';try{const r=await fetch('/api/dashboard-login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){error.textContent=j.error||'Sign in failed';return}location.replace(destination)}catch(e){error.textContent='Unable to reach Rica Spa. Please try again.'}}document.getElementById('accountForm').onsubmit=e=>{e.preventDefault();signIn(Object.fromEntries(new FormData(e.currentTarget)))};document.getElementById('legacyForm').onsubmit=e=>{e.preventDefault();signIn(Object.fromEntries(new FormData(e.currentTarget)))};</script></body></html>
