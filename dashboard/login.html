<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d4e3e"><link rel="icon" href="/assets/img/favicon.png"><link rel="stylesheet" href="/dashboard/rica-dashboard.css"><title>Rica Spa | Staff Login</title><style>body{min-height:100vh;display:grid;place-items:center}.login{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 20px 50px rgba(18,53,43,.1)}.login-brand{text-align:center;margin-bottom:26px}.login-brand img{width:72px;height:72px;border-radius:50%}.login-brand h1{font-size:25px;margin:12px 0 4px}.login-brand p{color:var(--muted);margin:0;font-size:13px}.error{margin:12px 0;padding:10px;border-radius:8px;background:#f9e9e6;color:#7e3026;font-size:13px}</style></head><body><main class="login"><div class="login-brand"><img src="/assets/img/logo.png" alt="Rica Spa"><h1>Rica Spa</h1><p>Staff & administration</p></div><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><div id="error"></div><button type="submit" style="width:100%;margin-top:8px">Sign in</button></form></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),x=document.querySelector('#error');x.innerHTML='';try{const r=await fetch('/api/dashboard-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to sign in');location.href='/dashboard/'}catch(err){x.innerHTML='<div class="error">'+String(err.message).replace(/[&<>]/g,'')+'</div>'}};</script></body></html>
