<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d4e3e"><link rel="icon" href="/assets/img/favicon.png"><link rel="stylesheet" href="/dashboard/rica-dashboard.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><title>Rica Spa | Sign in</title><style>body{min-height:100vh;background:#fff}.auth-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-main{display:flex;align-items:center;justify-content:center;padding:32px}.auth-card{width:min(400px,100%)}.auth-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:38px}.auth-brand img{width:42px;height:42px;object-fit:contain}.auth-brand strong{font-size:20px;font-weight:600}.auth-copy h1{font-size:22px;letter-spacing:-.02em;margin:0 0 8px}.auth-copy p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 22px}.auth-form{display:grid;gap:14px}.auth-form label{display:grid;gap:7px;font-size:12px;font-weight:600}.auth-form input{width:100%;box-sizing:border-box}.auth-form button{width:100%;margin-top:4px}.auth-link{color:var(--g);font-weight:700;text-decoration:underline;text-underline-offset:3px}.auth-note{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin-top:22px}.auth-visual{background:linear-gradient(135deg,#eef3ee,#e7e0d3);position:relative;overflow:hidden}.auth-visual:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,255,255,.45);top:10%;left:15%}.visual-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:9%}.visual-card{position:relative;width:min(480px,85%);border:1px solid rgba(29,78,62,.12);border-radius:24px;background:rgba(255,255,255,.76);box-shadow:0 30px 80px rgba(18,53,43,.12);padding:34px}.visual-card img{width:58px;height:58px;object-fit:contain;margin-bottom:30px}.visual-card h2{font-size:30px;line-height:1.1;margin:0 0 12px;color:#173d31}.visual-card p{color:#66706a;line-height:1.65;font-size:13px;max-width:330px}.error{padding:10px 12px;border-radius:8px;background:#f9e9e6;color:#7e3026;font-size:12px}@media(max-width:800px){.auth-page{grid-template-columns:1fr}.auth-visual{display:none}.auth-main{padding:24px}.auth-brand{margin-bottom:28px}}</style></head><body><div class="auth-page"><main class="auth-main"><div class="auth-card"><div class="auth-brand"><img src="/assets/img/logo.png" alt="Rica Spa"><strong>Rica Spa</strong></div><div class="auth-copy"><h1>Sign in</h1><p>Enter your email and password below to log into your account. Don't have an account? <a class="auth-link" href="/dashboard/setup.html">Sign Up</a></p></div><form class="auth-form" id="login"><label>Email<input name="email" type="email" autocomplete="username" placeholder="name@example.com" required></label><label>Password<input name="password" type="password" autocomplete="current-password" placeholder="••••••••" required></label><div id="error"></div><button type="submit">Sign in</button></form><p class="auth-note">By clicking sign in, you agree to our <a class="auth-link" href="/terms">Terms of Service</a> and <a class="auth-link" href="/privacy">Privacy Policy</a>.</p></div></main><aside class="auth-visual"><div class="visual-inner"><div class="visual-card"><img src="/assets/img/logo.png" alt="Rica Spa"><h2>Rica Spa<br>Administration</h2><p>A focused workspace for bookings, vouchers, staff approvals and daily operations.</p></div></div></aside></div><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),x=document.querySelector('#error'),b=e.target.querySelector('button');x.innerHTML='';b.disabled=true;b.textContent='Signing in…';try{const r=await fetch('/api/dashboard-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to sign in');location.href='/dashboard/'}catch(err){x.innerHTML='<div class="error">'+String(err.message).replace(/[&<>]/g,'')+'</div>';b.disabled=false;b.textContent='Sign in'}};</script></body></html>
