<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rica Spa | Staff Signup</title><link rel="icon" href="/dashboard/images/favicon.svg"><style>:root{font-family:Inter,system-ui,sans-serif;color:#173d31;background:#f8f5ef}body{min-height:100vh;display:grid;place-items:center;margin:0}.card{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e6dfd1;border-radius:20px;padding:32px;box-shadow:0 18px 60px #173d3118}h1{margin:0 0 6px;font-family:Georgia,serif}.muted{color:#66736d;margin:0 0 24px}.logo{width:58px;height:58px;margin-bottom:18px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 18px}.roles label{border:1px solid #ddd6c8;border-radius:12px;padding:12px;cursor:pointer}.roles input{margin-right:8px}label.field{display:grid;gap:6px;margin:14px 0;font-size:14px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d2c7;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#1d4e3e;color:#fff;font-weight:700;cursor:pointer;margin-top:10px}.hint{font-size:12px;color:#69746e;margin-top:10px}.status{margin-top:14px;font-size:14px}</style></head><body><main class="card"><img class="logo" src="/dashboard/images/rica-logo.svg" alt="Rica Spa"><h1>Staff access</h1><p class="muted">Create a Rica Spa dashboard account.</p><form id="form"><div class="roles"><label><input type="radio" name="role" value="employee" checked> Employee</label><label><input type="radio" name="role" value="superuser"> Superuser</label></div><label class="field">Full name<input name="name" required minlength="2" autocomplete="name"></label><label class="field">Email<input name="email" type="email" required autocomplete="email"></label><label class="field">Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label class="field" id="setupWrap" hidden>Superuser setup key<input name="setupKey" type="password" autocomplete="off"></label><button>Create account</button><p class="hint">Employee accounts are pending until approved. Superuser creation requires the existing staff setup key.</p><div class="status" id="status"></div></form></main><script>const form=document.querySelector('#form'),wrap=document.querySelector('#setupWrap'),status=document.querySelector('#status');document.querySelectorAll('[name=role]').forEach(r=>r.onchange=()=>wrap.hidden=r.value!=='superuser');form.onsubmit=async e=>{e.preventDefault();status.textContent='Creating…';const data=Object.fromEntries(new FormData(form));try{const r=await fetch('/api/dashboard-signup',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(data)}),j=await r.json();status.textContent=j.message||j.error||'Done';if(r.ok)form.reset()}catch{status.textContent='Could not reach the server.'}};</script></body></html>
