<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d31"><link rel="manifest" href="/manifest.webmanifest"><title>Rica Spa | Create account</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173d31;background:#f6f3ec}*{box-sizing:border-box}body{margin:0;min-height:100vh}.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.brand{background:linear-gradient(145deg,#173d31,#285744);color:#fff;padding:clamp(32px,7vw,88px);display:flex;align-items:center}.brand-inner{max-width:520px}.mark{display:inline-flex;width:54px;height:54px;border:1px solid #d5b46b;border-radius:16px;align-items:center;justify-content:center;color:#d5b46b;font:700 25px Georgia,serif}.brand-name{margin:22px 0 0;font:400 clamp(38px,5vw,68px)/.98 Georgia,serif}.brand p{max-width:430px;color:#e4eee8;font-size:16px;line-height:1.7}.panel{display:flex;align-items:center;justify-content:center;padding:32px}.card{width:min(440px,100%)}.eyebrow{color:#a47c38;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.card h1{font:400 42px/1.1 Georgia,serif;margin:8px 0}.muted{color:#6d756f;margin:0 0 24px}label{display:grid;gap:7px;margin:14px 0;font-size:13px;font-weight:700}input,select{width:100%;padding:12px 14px;border:1px solid #ded8cc;border-radius:10px;background:#fff;font:inherit}button{width:100%;padding:14px;border:0;border-radius:10px;background:#173d31;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.hint{font-size:12px;color:#727b75;margin-top:5px}.error{color:#a23d3d;font-size:13px;margin-top:12px}.footer{text-align:center;color:#6d756f;font-size:13px;margin-top:20px}.footer a{color:#173d31;font-weight:800;text-decoration:none}.setup{display:none}.setup.show{display:block}.check{display:flex;align-items:center;gap:9px;font-size:13px;margin:12px 0}.check input{width:auto}@media(max-width:800px){.auth{grid-template-columns:1fr}.brand{display:none}.panel{min-height:100vh}} </style></head><body><main class="auth"><section class="brand"><div class="brand-inner"><span class="mark">R</span><h2 class="brand-name">Rica Spa</h2><p>Create your staff account. Employee accounts remain pending until a superuser approves them.</p></div></section><section class="panel"><div class="card"><div class="eyebrow">Staff portal</div><h1>Create account</h1><p class="muted">Set up your Rica Spa staff access.</p><form id="form"><label>Full name<input name="name" autocomplete="name" required minlength="2"></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Account type<select name="role" id="role"><option value="employee">Employee</option><option value="superuser">Superuser</option></select></label><div id="setup" class="setup"><label>Superuser setup key<input name="setupKey" type="password" autocomplete="off"><span class="hint">Required only for initial superuser setup.</span></label></div><button type="submit">Create account</button><p id="error" class="error"></p></form><p class="footer">Already have an account? <a href="/dashboard/login.html">Sign in</a></p></div></section></main><script>const role=document.getElementById('role'),setup=document.getElementById('setup'),error=document.getElementById('error');role.onchange=()=>setup.classList.toggle('show',role.value==='superuser');document.getElementById('form').onsubmit=async e=>{e.preventDefault();error.textContent='';const data=Object.fromEntries(new FormData(e.currentTarget));try{const r=await fetch('/api/dashboard-signup',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok){error.textContent=j.error||'Could not create account';return}location.replace(
