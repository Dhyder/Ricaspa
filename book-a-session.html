<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Session | Rica Spa</title><meta name="description" content="Book a massage and wellness session at Rica Spa in Westlands, Nairobi."><link rel="canonical" href="https://www.ricaspa.beauty/book-a-session.html"><link rel="icon" href="/assets/img/favicon.png"><link rel="stylesheet" href="/assets/vendor/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/assets/css/main.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body><main class="container" style="max-width:900px;padding:80px 20px"><p style="letter-spacing:3px;text-transform:uppercase;color:#b9924a;font-weight:700">Rica Spa · Westlands</p><h1>Book a Session</h1><p>Choose your preferred treatment, date and time. We'll confirm your session by phone or email.</p><form id="booking" action="/api/book-session" method="post" class="php-email-form mt-5"><div class="row gy-4"><div class="col-md-4"><input class="form-control" name="name" placeholder="Your Name" required></div><div class="col-md-4"><input class="form-control" type="email" name="email" placeholder="Your Email" required></div><div class="col-md-4"><input class="form-control" type="tel" name="phone" placeholder="Your Phone" required></div><div class="col-md-6"><select class="form-select" name="service"><option value="">Preferred service</option><option>Swedish Massage (1 Hour)</option><option>Deep Tissue Massage (1 Hour)</option><option>Sports & Thai Massage</option><option>Foam Massage (1 Hour)</option><option>Aromatherapy Massage</option><option>Hot Stone Massage (90 Minutes)</option><option>Prenatal Massage</option><option>Four Hands Massage</option><option>Back Massage (30 Minutes)</option><option>Foot Massage (20 Minutes)</option><option>Head Massage (20 Minutes)</option><option>Steam Bath</option><option>Moroccan Bath Ritual</option></select></div><div class="col-md-3"><input class="form-control" type="date" name="date" required></div><div class="col-md-3"><input class="form-control" type="time" name="time" required></div><div class="col-12"><textarea class="form-control" name="message" rows="4" placeholder="Special requests (optional)"></textarea></div><div class="col-12"><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true"><div class="cf-turnstile" data-sitekey="0x4AAAAAAEcnrbs179lUlLpV" data-theme="light"></div></div></div><div id="status" style="margin-top:20px"></div><button class="btn btn-book-table mt-4" type="submit">Request My Session</button></form><p style="margin-top:28px"><a href="/">Back to Rica Spa</a></p></main><script>const f=document.querySelector('#booking'),s=document.querySelector('#status');f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='Sending your booking request…';try{const r=await fetch(f.action,{method:'POST',body:new FormData(f)}),text=await r.text();if(text==='OK'){s.textContent='Booking request sent. We will contact you to confirm.';window.dispatchEvent(new CustomEvent('rica:form-success',{detail:{service:f.service.value}}));f.reset()}else{s.textContent=text}}catch{s.textContent='Something went wrong. Please WhatsApp Rica Spa instead.'}});</script></body></html>
