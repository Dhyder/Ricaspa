<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rica Spa — Booking Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  body{font-family:system-ui,sans-serif;background:#16241C;color:#F8F3E6;max-width:640px;margin:0 auto;padding:32px 20px;}
  h1{font-size:20px;margin-bottom:4px;}
  p.sub{color:rgba(248,243,230,0.6);font-size:13px;margin-top:0;margin-bottom:24px;}
  input,select{padding:12px;border-radius:8px;border:1px solid rgba(248,243,230,0.25);background:rgba(248,243,230,0.06);color:#F8F3E6;font-size:15px;box-sizing:border-box;}
  #gate{max-width:320px;margin:80px auto;text-align:center;}
  #gate input{width:100%;margin-bottom:10px;}
  button{padding:10px 14px;border-radius:8px;border:none;font-weight:600;font-size:13px;cursor:pointer;}
  .btn-unlock{width:100%;padding:12px;background:rgba(248,243,230,0.12);color:#F8F3E6;margin-bottom:10px;}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
  .toolbar button{background:rgba(248,243,230,0.1);color:#F8F3E6;}
  .toolbar button.active{background:#B9924A;color:#16241C;}
  #dateInput{flex:1;min-width:150px;}
  #list{display:flex;flex-direction:column;gap:10px;}
  .card{background:rgba(248,243,230,0.06);border-radius:10px;padding:14px 16px;}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .time{font-size:17px;font-weight:700;color:#B9924A;}
  .status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px;}
  .status-new{background:rgba(185,146,74,0.25);color:#B9924A;}
  .status-confirmed{background:rgba(111,191,115,0.2);color:#6fbf73;}
  .status-declined{background:rgba(224,122,122,0.2);color:#e07a7a;}
  .status-completed{background:rgba(248,243,230,0.15);color:rgba(248,243,230,0.7);}
  .status-no-show{background:rgba(224,122,122,0.15);color:#e07a7a;}
  .name{font-size:15px;font-weight:600;margin-bottom:2px;}
  .meta{font-size:13px;color:rgba(248,243,230,0.65);line-height:1.5;}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .actions button{background:rgba(248,243,230,0.1);color:#F8F3E6;font-size:12px;padding:7px 10px;}
  .actions button.confirm{background:rgba(111,191,115,0.2);color:#6fbf73;}
  .actions button.decline{background:rgba(224,122,122,0.2);color:#e07a7a;}
  #empty,#loading{color:rgba(248,243,230,0.5);text-align:center;padding:40px 0;font-size:14px;}
  #error{background:rgba(224,122,122,0.15);color:#e07a7a;padding:14px;border-radius:8px;margin-bottom:16px;display:none;}
</style>
</head>
<body>

<div id="gate">
  <h1>Staff access</h1>
  <p class="sub">Enter the voucher desk passphrase — same one as the redemption page.</p>
  <input id="secretInput" type="password" placeholder="Passphrase" onkeydown="if(event.key==='Enter')unlock()">
  <button class="btn-unlock" onclick="unlock()">Unlock</button>
  <div id="gateError" style="display:none;color:#e07a7a;font-size:13px;margin-top:6px;"></div>
</div>

<div id="tracker" style="display:none;">
  <h1>Booking Tracker</h1>
  <p class="sub">Session requests from the site's booking form. Requests aren't confirmed appointments until you mark them. · <a href="/staff-vouchers.html" style="color:#B9924A;">Voucher desk →</a></p>

  <div id="error"></div>

  <div class="toolbar">
    <button id="todayBtn" onclick="setView('today')">Today</button>
    <button id="upcomingBtn" onclick="setView('upcoming')">Upcoming</button>
    <input id="dateInput" type="date" onchange="setView('date')">
  </div>

  <div id="loading" style="display:none;">Loading…</div>
  <div id="empty" style="display:none;">No booking requests for this range.</div>
  <div id="list"></div>
</div>

<script>
  let staffSecret = '';
  let currentView = 'today';

  function unlock() {
    const input = document.getElementById('secretInput').value;
    if (!input) return;
    verifyAndEnter(input);
  }

  async function verifyAndEnter(secret) {
    const gateError = document.getElementById('gateError');
    gateError.style.display = 'none';
    try {
      const res = await fetch('/api/staff-auth', { headers: { 'X-Staff-Secret': secret } });
      if (!res.ok) {
        sessionStorage.removeItem('ricaspa_staff_secret');
        gateError.textContent = 'Wrong passphrase.';
        gateError.style.display = 'block';
        return;
      }
      staffSecret = secret;
      sessionStorage.setItem('ricaspa_staff_secret', secret);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('tracker').style.display = '';
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateInput').value = today;
      setView('today');
    } catch {
      gateError.textContent = 'Network error, please try again.';
      gateError.style.display = 'block';
    }
  }

  (function tryAutoUnlock() {
    const saved = sessionStorage.getItem('ricaspa_staff_secret');
    if (saved) verifyAndEnter(saved);
  })();

  function setView(view) {
    currentView = view;
    document.getElementById('todayBtn').className = view === 'today' ? 'active' : '';
    document.getElementById('upcomingBtn').className = view === 'upcoming' ? 'active' : '';
    load();
  }

  async function load() {
    document.getElementById('error').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('empty').style.display = 'none';
    document.getElementById('list').innerHTML = '';

    let url;
    if (currentView === 'upcoming') {
      url = '/api/bookings-list?upcoming=1';
    } else if (currentView === 'date') {
      url = '/api/bookings-list?date=' + document.getElementById('dateInput').value;
    } else {
      const today = new Date().toISOString().split('T')[0];
      url = '/api/bookings-list?date=' + today;
    }

    try {
      const res = await fetch(url, { headers: { 'X-Staff-Secret': staffSecret } });
      if (res.status === 401) {
        sessionStorage.removeItem('ricaspa_staff_secret');
        document.getElementById('tracker').style.display = 'none';
        document.getElementById('gate').style.display = '';
        document.getElementById('gateError').textContent = 'Session expired or passphrase changed — please re-enter it.';
        document.getElementById('gateError').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        return;
      }
      const data = await res.json();
      document.getElementById('loading').style.display = 'none';

      if (!res.ok) {
        document.getElementById('error').textContent = data.error || 'Something went wrong.';
        document.getElementById('error').style.display = 'block';
        return;
      }

      render(data.bookings || []);
    } catch {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').textContent = 'Network error, please try again.';
      document.getElementById('error').style.display = 'block';
    }
  }

  function render(bookings) {
    if (bookings.length === 0) {
      document.getElementById('empty').style.display = 'block';
      return;
    }
    const showDate = currentView === 'upcoming';
    document.getElementById('list').innerHTML = bookings.map(b => `
      <div class="card">
        <div class="card-top">
          <span class="time">${showDate ? (escapeHtml(b.preferred_date) + ' · ') : ''}${escapeHtml(b.preferred_time || '—')}</span>
          <span class="status status-${b.status}">${b.status}</span>
        </div>
        <div class="name">${escapeHtml(b.name)}</div>
        <div class="meta">
          ${escapeHtml(b.service || 'No preference given')}<br>
          ${escapeHtml(b.phone || '')} ${b.phone && b.email ? '·' : ''} ${escapeHtml(b.email || '')}
          ${b.message ? '<br>"' + escapeHtml(b.message) + '"' : ''}
        </div>
        <div class="actions">
          ${b.status !== 'confirmed' ? `<button class="confirm" onclick="updateStatus('${b.ref}','confirmed')">Confirm</button>` : ''}
          ${b.status !== 'declined' ? `<button class="decline" onclick="updateStatus('${b.ref}','declined')">Decline</button>` : ''}
          ${b.status !== 'completed' ? `<button onclick="updateStatus('${b.ref}','completed')">Mark completed</button>` : ''}
          ${b.status !== 'no-show' ? `<button onclick="updateStatus('${b.ref}','no-show')">No-show</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function updateStatus(ref, status) {
    try {
      const res = await fetch('/api/update-booking-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Staff-Secret': staffSecret },
        body: JSON.stringify({ ref, status }),
      });
      if (!res.ok) {
        const data = await res.json();
        alert(data.error || 'Could not update status.');
        return;
      }
      load();
    } catch {
      alert('Network error, please try again.');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
